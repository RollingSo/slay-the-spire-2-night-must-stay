<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>复仇者动画提取预览</title><style>body{margin:24px;background:#20232b;color:#eee;font:16px system-ui}button,select,input{font:inherit;margin:5px;padding:7px}canvas{width:416px;height:560px;max-width:90vw;border:1px solid #555;background:#303846}main{display:flex;gap:24px;flex-wrap:wrap}video{width:300px;height:404px}small{color:#aeb7c5}p{max-width:850px;line-height:1.7}</style><h1>复仇者 · 动画提取预览</h1><p>保留用户确认的原爪击法术手势。本页为素材预览，尚未接入游戏。切换背景检查白发、衣裙与琴弦；游戏节奏为建议映射。</p><div><button id="idle">战斗待机</button><button id="attack">爪击 / 再次触发</button><button id="stop">立即回待机</button><button id="pause">暂停</button><button id="prev">上一帧</button><button id="next">下一帧</button></div><div>节奏 <select id="mode"><option value="source">源素材节奏</option><option value="normal">预计正常（攻击1秒）</option><option value="fast">预计快速（攻击0.5秒）</option><option value="instant">预计瞬时（跳过攻击）</option></select>背景 <select id="bg"><option value="checker">棋盘</option><option value="dark">深色</option><option value="light">浅色</option></select>显示 <select id="size"><option value="large">放大审查</option><option value="game">约游戏可见高度216像素</option></select></div><main><section><canvas id="c" width="416" height="560"></canvas><div id="info"></div></section><section><div>原视频对照（独立播放）</div><video id="v" controls loop src="战斗待机_源视频.mp4"></video><p><small>图集使用同一416×560画布，不逐帧居中或缩放。待机为缓入缓出的往返循环，避免交叉过渡双影；后半程衣料与发梢运动会反向。瞬时与中断仅模拟切换策略，未验证真实游戏状态。</small></p></section></main><script>
let meta,assets={},action='战斗待机',elapsed=0,paused=false,last=performance.now(),manual=null;
const c=document.querySelector('#c'),ctx=c.getContext('2d'),mode=document.querySelector('#mode'),info=document.querySelector('#info');
async function init(){meta=await(await fetch('../../revenant_assets/combat/sequence_candidates/动画提取记录.json')).json();for(let [n,a] of Object.entries(meta.actions)){assets[n]=await Promise.all(a.atlas_pages.map(p=>new Promise((ok,no)=>{let i=new Image;i.onload=()=>ok(i);i.onerror=no;i.src="../../revenant_assets/combat/sequence_candidates/"+p})));}requestAnimationFrame(tick)}
function select(n){action=n;elapsed=0;manual=null;document.querySelector('#v').src=n+'_源视频.mp4'}
document.querySelector('#idle').onclick=()=>select('战斗待机');document.querySelector('#attack').onclick=()=>select('爪击攻击');document.querySelector('#stop').onclick=()=>select('战斗待机');document.querySelector('#pause').onclick=()=>{if(paused&&manual!==null){let t=manual/24,a=meta.actions[action];if(action==='爪击攻击'&&mode.value!=='source'){let m=meta.timing.proposed_source_marker_seconds??.625;elapsed=t<=m?t*.15/m:.15+(t-m)*.85/(a.resource_duration-m);if(mode.value==='fast')elapsed/=2;}else elapsed=t/(mode.value==='fast'?2:1);}paused=!paused;document.querySelector('#pause').textContent=paused?'继续':'暂停';manual=null};
function step(d){paused=true;document.querySelector('#pause').textContent='继续';let a=meta.actions[action];manual=Math.min(a.frame_count-1,Math.max(0,(manual??frame())+d))}document.querySelector('#prev').onclick=()=>step(-1);document.querySelector('#next').onclick=()=>step(1);mode.onchange=()=>{elapsed=0;manual=null};
function frame(){let a=meta.actions[action],t=elapsed,m=mode.value;if(action==='爪击攻击'&&m!=='source'){if(m==='instant')return 0;let speed=m==='fast'?2:1,x=t*speed;let release=meta.timing.proposed_source_marker_seconds??.625; t=x<=.15?x*release/.15:release+(x-.15)*(a.resource_duration-release)/.85;}else if(m==='fast')t*=2;return Math.floor(t*24)}
function tick(now){let dt=Math.min((now-last)/1000,.1);last=now;if(!paused)elapsed+=dt;let a=meta.actions[action],i=manual??frame();if(action==='爪击攻击'&&!paused&&((mode.value==='instant')||i>=a.frame_count)){select('战斗待机');a=meta.actions[action];i=0;}i=((i%a.frame_count)+a.frame_count)%a.frame_count;let bg=document.querySelector('#bg').value;ctx.fillStyle=bg==='light'?'#eee':bg==='dark'?'#222936':'#888';ctx.fillRect(0,0,416,560);if(bg==='checker'){ctx.fillStyle='#b9b9b9';for(let y=0;y<560;y+=16)for(let x=0;x<416;x+=16)if((x/16+y/16)%2)ctx.fillRect(x,y,16,16)}let cell=(a.atlas_indices??[])[i]??i;let page=assets[action][Math.floor(cell/16)],k=cell%16;if(document.querySelector('#size').value==='game'){ctx.drawImage(page,k%4*416,Math.floor(k/4)*560,416,560,125,160,166.4,224)}else ctx.drawImage(page,k%4*416,Math.floor(k/4)*560,416,560,0,0,416,560);info.textContent=action+' · '+i+' / '+(a.frame_count-1)+'帧 · 资源 '+a.resource_duration.toFixed(3)+'秒';requestAnimationFrame(tick)}
init().catch(e=>info.textContent='请从本地HTTP预览服务打开本页：'+e);
</script></html>
