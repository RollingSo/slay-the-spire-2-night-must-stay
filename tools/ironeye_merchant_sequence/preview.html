<!doctype html><meta charset="utf-8"><title>铁之眼商店透明待机</title><style>body{background:#222;color:#eee;font:16px sans-serif;padding:24px}canvas{background:#29384a;max-height:78vh;max-width:85vw}button,input{margin:8px;padding:8px}</style><h2>铁之眼商店待机 · 透明图集</h2><p>120帧 / 60 FPS / 2秒循环；Windows引擎、打包与实际商店效果待验证。</p><button id="pause">暂停／继续</button><button id="prev">上一帧</button><button id="next">下一帧</button><button id="restart">重新播放</button><input type="color" id="bg" value="#29384a"><span id="info"></span><br><canvas id="c"></canvas><script>const W=547,H=784;const c=document.querySelector('#c');c.width=W;c.height=H;const ctx=c.getContext('2d');const imgs=Array.from({length:8},(_,i)=>{let im=new Image();im.src='../../ironeye_assets/merchant/idle_sequence/atlas_'+String(i+1).padStart(2,'0')+'.png';return im});let frame=0,paused=false,t=0,last=performance.now();document.querySelector('#pause').onclick=()=>paused=!paused;document.querySelector('#prev').onclick=()=>{paused=true;frame=(frame+119)%120};document.querySelector('#next').onclick=()=>{paused=true;frame=(frame+1)%120};document.querySelector('#restart').onclick=()=>{t=0;frame=0};document.querySelector('#bg').oninput=e=>c.style.background=e.target.value;function tick(now){if(!paused){t+=(now-last)/1000;frame=Math.floor(t*60)%120}last=now;ctx.clearRect(0,0,W,H);const im=imgs[Math.floor(frame/16)],cell=frame%16;if(im.complete&&im.naturalWidth)ctx.drawImage(im,cell%4*W,Math.floor(cell/4)*H,W,H,0,0,W,H);document.querySelector('#info').textContent=`第${frame}帧`;requestAnimationFrame(tick)}requestAnimationFrame(tick)</script>
