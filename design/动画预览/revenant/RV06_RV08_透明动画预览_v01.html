<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>复仇者 · 受击与商店待机透明预览</title><style>body{background:#222630;color:#eee;margin:24px;font:16px system-ui;line-height:1.6}main{display:flex;gap:32px;flex-wrap:wrap}h2{font-size:20px}canvas{width:332.8px;height:448px;border:1px solid #677}.small canvas{width:166.4px;height:224px}button,select{font:inherit;padding:7px;margin:4px}p{max-width:950px}a{color:#afd0ff}small{color:#bdc5d5}</style><h1>受击与商店待机 · 透明动画预览</h1><p>受击沿用已接受的0.833秒剪辑；商店保持低头看掌心金币的独立姿态。本页为已确认的素材预览，尚未接入游戏。</p><div>背景 <select id="bg"><option value="dark">深色</option><option value="light">浅色</option><option value="checker">棋盘</option><option value="pink">亮粉：检查漏底</option></select><button id="pause">暂停</button><button id="size">切换约游戏尺寸 / 放大</button><select id="speed"><option value="1">正常</option><option value="0.333333">三倍慢放</option><option value="2">快速</option></select></div><div><button id="hit">触发 / 重播受击</button><button id="stop">立即回待机</button><button id="prev">受击上一帧</button><button id="next">受击下一帧</button></div><main id="stage"><section><h2>受击：待机 → 受击 → 待机</h2><canvas id="hurt" width="416" height="560"></canvas><div id="hurtInfo"></div><small>保留原视频边缘裁切；衔接待机为同一源片首帧。</small></section><section><h2>商店待机：4秒循环</h2><canvas id="shop" width="416" height="560"></canvas><div id="shopInfo"></div><small>缓入缓出往返循环；后半程衣料与发梢反向播放。</small></section></main><p id="status">正在加载透明图集…</p><p><a href="RV06_受击_透明审阅_v01.jpg">受击深浅底审查图</a> · <a href="RV08_商店待机_透明审阅_v01.jpg">商店深浅底审查图</a></p><script>
let data,images={},paused=false,t=0,shopTime=0,last=performance.now(),manual=null,drawn=0;
const get=s=>document.querySelector(s);
function back(ctx){let c=get('#bg').value;ctx.fillStyle={dark:'#222936',light:'#eee',checker:'#999',pink:'#f500b4'}[c];ctx.fillRect(0,0,416,560);if(c==='checker'){ctx.fillStyle='#ccc';for(let y=0;y<560;y+=16)for(let x=0;x<416;x+=16)if((x/16+y/16)%2)ctx.fillRect(x,y,16,16)}}
function render(id,name,i){let a=data[name];i=Math.max(0,Math.min(a.frames-1,i));let k=a.indices[i],im=images[name][Math.floor(k/16)],ctx=get(id).getContext('2d');back(ctx);ctx.drawImage(im,k%4*416,Math.floor(k%16/4)*560,416,560,0,0,416,560)}
get('#pause').onclick=()=>{paused=!paused;get('#pause').textContent=paused?'继续':'暂停';if(!paused&&manual!==null){t=1+manual/24;manual=null}};get('#size').onclick=()=>get('#stage').classList.toggle('small');get('#hit').onclick=()=>{t=1;manual=null};get('#stop').onclick=()=>{t=0;manual=null};function step(d){paused=true;get('#pause').textContent='继续';manual=Math.min(19,Math.max(0,(manual??drawn)+d))}get('#prev').onclick=()=>step(-1);get('#next').onclick=()=>step(1);
function tick(now){let dt=Math.min((now-last)/1000,.1);last=now;if(!paused){t+=dt*Number(get('#speed').value);shopTime+=dt}let phase=t%(2+20/24);let hit=manual!==null||(phase>=1&&phase<1+20/24);let i=manual??(hit?Math.floor((phase-1)*24):0);drawn=i;render('#hurt',hit?'RV06_受击':'context_idle',i);render('#shop','RV08_商店待机',Math.floor(shopTime*24)%96);get('#hurtInfo').textContent=hit?'受击 '+i+'/19帧':'待机';get('#shopInfo').textContent='商店 '+Math.floor(shopTime*24)%96+'/95帧';requestAnimationFrame(tick)}
(async()=>{data=await(await fetch('RV06_RV08_透明预览记录_v01.json',{cache:'no-store'})).json();for(let n of['RV06_受击','RV08_商店待机','context_idle'])images[n]=await Promise.all(data[n].pages.map(p=>new Promise((ok,no)=>{let i=new Image;i.onload=()=>ok(i);i.onerror=no;i.src=p+'?review=rv06rv08-v1'})));get('#status').textContent='透明图集已加载。请重点看袖子、双前臂、手指、金币和琴框开口；当前为用户已确认素材。';requestAnimationFrame(tick)})().catch(e=>get('#status').textContent='加载失败：'+e);
</script></html>
